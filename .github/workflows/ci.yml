name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Clone plenary.nvim
        run: git clone --depth 1 https://github.com/nvim-lua/plenary.nvim /tmp/plenary.nvim

      - name: Install tsk
        run: |
          curl -sSfL "https://github.com/iliailmer/taskboard/releases/download/v${TSK_VERSION}/taskboard-x86_64-unknown-linux-gnu.tar.xz" | tar xJ -C /tmp
          /tmp/taskboard-x86_64-unknown-linux-gnu/tsk --version
        env:
          TSK_VERSION: 0.3.0

      - name: Run tests
        run: make test
        env:
          PLENARY_PATH: /tmp/plenary.nvim
          TSK_BIN: /tmp/taskboard-x86_64-unknown-linux-gnu/tsk
